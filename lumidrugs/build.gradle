plugins {
    id 'com.gradleup.shadow'
}

group = 'com.drugs'
version = '2.0.0'

sourceSets {
    main {
        java.srcDirs = [rootProject.file('src/main/java')]
        resources.srcDirs = [rootProject.file('src/main/resources')]
    }
    test {
        java.srcDirs = [rootProject.file('src/test/java')]
        resources.srcDirs = [rootProject.file('src/test/resources')]
    }
}

// Compile against the official release; the Maven repository has no published 2.0 API.
repositories {
    ivy {
        url = 'https://github.com/SkytAsul/BeautyQuests/releases/download'
        patternLayout { artifact '[revision]/[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'fr.skytasul.release' }
    }
}

dependencies {
    compileOnly('fr.skytasul.release:beautyquests:2.0.0') { transitive = false }
    testImplementation 'commons-lang:commons-lang:2.6'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'me.clip:placeholderapi:2.11.5'
}

tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        filter { line -> line.replace('${project.version}', project.version.toString()) }
    }
}

tasks.named('jar') { archiveClassifier = 'plain' }
tasks.named('shadowJar') {
    archiveFileName = 'LumiDrugs.jar'
}
tasks.named('assemble') { dependsOn tasks.named('shadowJar') }

// Validate the deployable artifact as well as the compiled classes used by tests.
def verifyPluginJar = tasks.register('verifyPluginJar') {
    dependsOn tasks.named('shadowJar')
    inputs.file(tasks.named('shadowJar').flatMap { it.archiveFile })
    inputs.files(sourceSets.main.output.classesDirs)
    doLast {
        def archive = tasks.named('shadowJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def missing = []
            sourceSets.main.output.classesDirs.each { directory ->
                fileTree(directory).matching { include '**/*.class' }.each { compiled ->
                    def entry = directory.toPath().relativize(compiled.toPath()).toString().replace('\\', '/')
                    if (zip.getEntry(entry) == null) missing.add(entry)
                }
            }
            ['plugin.yml', 'com/drugs/DrugsV2.class', 'com/drugs/recipes/RecipeUpdates.class',
             'com/drugs/recipes/BrewingRecipes.class', 'com/drugs/recipes/FlavorInfusionListener.class'].each { entry ->
                if (zip.getEntry(entry) == null) missing.add(entry)
            }
            if (!missing.isEmpty()) throw new GradleException("Incomplete plugin JAR: ${missing.unique().join(', ')}")
            logger.lifecycle("Verified all plugin classes are packaged in ${archive.name}")
        }
    }
}
tasks.named('check') { dependsOn verifyPluginJar }
