# Optional manual setup; the default -1 setting creates a quest automatically.
# Example BeautyQuests 2.0 quest. Pick an unused ID before installing.
# Copy to plugins/BeautyQuests/quests/9000.yml with the server stopped.
# Set enforcer.beautyquests-quest-id: 9000 in plugins/LumiDrugs/cartel.yml.
id: 9000
name: Cartel delivery
repeatable: true
cancellable: true
manager:
  branches:
    '0':
      stages:
        '0':
          stageType: lumidrugs-cartel-delivery
          options:
            lumi-follow:
              enabled: true
              soliciting: true
              solicitation-radius: 3.5
              approach-timeout-seconds: 60
              status-data: solicitation
              dialog: cartel-enforcer
              npc-data: npc
              open-doors: true
              climbing: true
              max-climb-height: 6
              climb-timeout-ticks: 100
              teleport-recovery: true
              follow-teleports: true
              cross-world: false
      endingStages: {}
