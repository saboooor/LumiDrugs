# Citizens integration, encounters and contracts. Drug prices live in prices.yml.
prices: {}
preferences:
  enabled: true
  rotation-hours: 24
  price-multiplier: 1.5
  strains: {}
npc:
  skin-name: ''
  skin:
    name: cartel-default
    texture: 
    signature: 
enforcer:
  beautyquests-quest-id: -1
  enabled: true
  min-amount: 8
  max-amount: 32
  check-interval-seconds: 300
  spawn-chance: 0.25
  cooldown-seconds: 1800
  max-active: 8
  spawn-min-distance: 8
  spawn-max-distance: 12
  # Approach radius and timeout belong in the BeautyQuests lumi-follow option (soliciting: true).
  deadline-seconds: 90
  warning-interval-seconds: 15
  direct-delivery:
    enabled: true
    multiplier: 3.0
    min-distance: 60
    max-distance: 200
    deadline-seconds: 240
    radius: 4.0
  aggravation:
    angry-after-refusals: 15
    furious-after-refusals: 20
    angry-deadline-seconds: 45
    furious-deadline-seconds: 30
  failure-damage: 0
  messages:
    arrival: '&8Someone from the cartel is heading your way.'
    demand: '&4Cartel: &cSell me {amount} {drug} within {seconds}s, or you''ll answer to the cartel. Throw the drugs
      near me. Smaller deliveries count. You''ll be paid.'
    warning: '&cThe cartel doesn''t like waiting. Throw {remaining} more {drug} near me. You have {seconds}s left.'
    failure: '&4Cartel: &cYou refused our deal. We''ll remember this. Watch your back.'
    success: '&2Cartel: &aGood. We can do business. You''re clear.'
    angry-arrival: '&cThe cartel enforcer is back, and he looks angry.'
    angry-demand: '&4Cartel: &cYou''ve refused us {refusals} times in a row. My patience is running out. Sell me
      {amount} {drug} in {seconds}s. Throw it near me. You''ll be paid.'
    angry-warning: '&4Cartel: &cDon''t test me again. {remaining} more {drug}, and only {seconds}s left.'
    angry-failure: '&4Cartel: &cThat''s {refusals} refusals in a row. You''re pushing your luck. Next time, come
      prepared.'
    furious-arrival: '&4The cartel enforcer is back. His patience with you is gone.'
    furious-demand: '&4Cartel: &c&lEnough! &r&cYou''ve refused us {refusals} times in a row. Sell me {amount} {drug}
      in {seconds}s. Throw it near me. You''ll be paid. No more excuses.'
    furious-warning: '&4Cartel: &c&lI''m done waiting! &r&c{remaining} more {drug}. {seconds}s left. Move!'
    furious-failure: '&4Cartel: &c&lAgain?! &r&c{refusals} refusals in a row. You''ve made an enemy of the cartel.
      This isn''t over.'
supply-contracts:
  enabled: true
  amount: 16
  deadline-hours: 24
