      material: DRIED_KELP
      display-name: '&6Tobacco'
      lore:
      - '&7Loose tobacco leaves.'
      - '&a&oHaste I'
      - '&a&oSpeed I'
      - '&a&oSaturation I'
      - '&7Abuse Potential: &cHigh'
      effects:
        HASTE:
          duration: 200
          amplifier: 0
        SPEED:
          duration: 140
          amplifier: 0
        SATURATION:
          duration: 40
          amplifier: 0
    recipe:
      type: smoker
      input-crop: tobacco
      cooking-time: 200
      experience: 0.1
    tolerance:
      max-tolerance: 8
      decay-delay-minutes: 3
      effectiveness-scaling:
        0: 1.0
        1: 0.9
        2: 0.8
        3: 0.7
        4: 0.6
        5: 0.5
        6: 0.4
        7: 0.3
        8: 0.1
    addiction:
      addictive: true
      points_per_use: 1
      addicted_at_points: 4
      withdrawal_after_seconds: 180
      decay:
        enabled: true
        points_decay_per_minute: 0.5
      withdrawal_effects:
      - type: SLOW_DIGGING
        amplifier: 0
      - type: HUNGER
        amplifier: 0
      - type: WEAKNESS
        amplifier: 0
    overdose:
