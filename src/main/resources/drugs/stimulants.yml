# Stimulants family. Hallucinations are optional named effects under drugs.<id>.hallucinations.
# Set enabled: false on an entry, or hallucinations: {} to disable all for a drug.
drugs:
  meth:
    item:
      material: QUARTZ
      display-name: '&bCrystal Meth'
      lore:
      - '&7High octane, high voltage. Good for mining'
      - '&a&oSpeed III'
      - '&a&oHaste II'
      - '&a&oNight Vision I'
      - '&c&oHunger I'
      - '&c&oWeakness II'
      - '&7OD Risk: &e&lMedium'
      - '&7Abuse Potential: &e&lMedium'
      effects:
        SPEED:
          duration: 2000
          amplifier: 2
        HASTE:
          duration: 3000
          amplifier: 1
        NIGHT_VISION:
          duration: 2000
          amplifier: 0
        HUNGER:
          duration: 1200
          amplifier: 0
        WEAKNESS:
          duration: 3000
          amplifier: 1
    recipe:
      shape:
      - ' L '
      - SBS
      - ' L '
      ingredients:
        L: QUARTZ
        S: AMETHYST_SHARD
        B: SUSPICIOUS_STEW
    tolerance:
      max-tolerance: 10
      decay-delay-minutes: 4
      effectiveness-scaling:
        0: 1.0
        1: 0.8
        2: 0.6
        3: 0.4
        4: 0.2
    addiction:
      addictive: true
      points_per_use: 1
      addicted_at_points: 4
      withdrawal_after_seconds: 240
      decay:
        enabled: true
        points_decay_per_minute: 2
      withdrawal_effects:
      - type: SLOW
        amplifier: 1
      - type: WEAKNESS
        amplifier: 1
      - type: SLOW_DIGGING
        amplifier: 1
      - type: HUNGER
        amplifier: 0
    overdose:
      effects:
      - type: effects
        potion_effects:
        - effect: NAUSEA
          duration: 1200
          amplifier: 0
        - effect: WEAKNESS
          duration: 1800
          amplifier: 1
        - effect: HUNGER
          duration: 1200
          amplifier: 1
      - type: damage
        amount: 16
        message: '&cYou collapse from a meth overdose!'
    hallucinations:
      paranoia:
        type: paranoia
        duration-seconds: 20
        scale-with-potency: true
        interval-ticks: 60
        shadow-chance: 0.65
        phantom-chance: 0.55
      high-tolerance:
        type: phantom
        near-tolerance-limit: true
        chance: 1.0
        duration-seconds: 4
        mobs:
        - CREEPER
        - ENDERMAN
        - CAVE_SPIDER
        - PHANTOM
        - WITHER_SKELETON
        speed: 0.32
