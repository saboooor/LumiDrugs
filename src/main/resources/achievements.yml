# Overdose-related achievements
overdose_death:
  title: "Flatline"
  description: "Die from a drug overdose"
  icon: "REDSTONE"
  trigger: "overdose_death"
  hidden: false
  notification:
    chat: true
    sound: "ENTITY_WITHER_DEATH"
    firework: false
  conditions:
    - "drug_id != null"

overdose_survive:
  title: "Close Call"
  description: "Survive an overdose attempt"
  icon: "GOLDEN_APPLE"
  trigger: "overdose_survive"
  hidden: false
  notification:
    chat: true
    sound: "ENTITY_PLAYER_LEVELUP"
    firework: false
  conditions:
    - "drug_id != null"
    - "attempt > 0"
    - "attempt < 3"
