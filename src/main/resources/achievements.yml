# Achievement definitions
# Each achievement needs:
#   - title: Display name (supports color codes with &)
#   - description: Description text (supports color codes)
#   - trigger: What triggers this achievement
#   - icon: Material to show when locked
#   - completed_icon: Material to show when unlocked
#
# Available triggers:
#   - first_drug_use: Triggered when a player uses any drug for the first time
#   - all_drugs_used: Triggered when a player has used every registered drug at least once
#   - use_at_max: Triggered when a player uses a drug while at max tolerance
#   - maxed_three: Triggered when a player hits max tolerance on 3 different drugs
#   - decay_full: Triggered when a maxed drug's tolerance decays all the way back to 0
#   - use_specific_drug: Triggered when a player uses a specific drug (requires drug_id parameter)
#   - craft_drug: Triggered when a player crafts any drug
#   - craft_specific: Triggered when a player crafts a specific drug (requires drug_id parameter)
#   - plant_crop: Triggered when a player plants any drug crop on hydrated farmland
#   - plant_specific_crop: Triggered when a player plants a specific crop (requires crop_id parameter)
#   - harvest_crop: Triggered when a player harvests a mature drug crop
#   - harvest_specific_crop: Triggered when a player harvests a specific mature crop (requires crop_id parameter)
#   - all_crops_harvested: Triggered when a player has harvested every drug crop at least once
#   - mutate_strain: Triggered when a player shears a mature cannabis plant that mutates into a child strain
#   - harvest_rare_strain: Triggered when a player harvests or mutates a rare, epic, or legendary cannabis strain
#   - place_farm_controller: Triggered when a player places a Farm Controller
#   - assign_farm_worker: Triggered when a player assigns a villager worker to a farm using a Work Contract
#   - refine_purity: Triggered when a player refines a drug's purity at a cauldron
#   - max_purity: Triggered when a player refines a drug to 100% purity
#   - infuse_flavor: Triggered when a player infuses a product with a flavor variant at a cauldron
#   - lace_drug: Triggered when a player laces one drug with another at a cauldron
#   - bong_hit: Triggered when a player takes a hit from a placed glass bong
#   - use_cure: Triggered when a player treats withdrawal using a cure item or rest
#   - cartel_sale: Triggered when a player sells drugs to a cartel buyer
#   - cartel_enforcer_complete: Triggered when a player fulfills a cartel enforcer's delivery demand
#   - supply_contract_complete: Triggered when a player completes a cartel supply contract
#   - overdose_survive: Triggered when a player survives an overdose
#   - overdose_death: Triggered when a player dies from an overdose
#   - use_count: Triggered when a player uses drugs a certain number of times (requires count parameter)

