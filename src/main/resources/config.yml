# Shared settings. Drug definitions live in drugs/<family>.yml.
# overdose.settings controls global limits; each drug has its own overdose.effects.
bong:
  enabled: true
  base-drug-id: blunt
  cooldown-ms: 1500
  item:
    material: GLASS_BOTTLE
    display-name: '&bGlass Bong'
    custom-model-data: 1024
  durability-uses: 24
farm:
  worker-tick-interval: 30
  max-harvest-per-cycle: 1
  max-plant-per-cycle: 2
purity:
  enabled: true
  refining-ingredient: QUARTZ
  refining-points: 5
overdose-warnings:
  enabled: true
  reminder-seconds: 60
flavors:
  berry:
    name: '&dBerry'
    ingredient: SWEET_BERRIES
    products:
    - vape
    - cart
    - edible
    - joint
    - blunt
    - energy_drink
  apple:
    name: '&cApple'
    ingredient: APPLE
    products:
    - vape
    - cart
    - edible
    - energy_drink
  melon:
    name: '&aMelon'
    ingredient: MELON_SLICE
    products:
    - vape
    - cart
    - edible
    - energy_drink
  honey:
    name: '&6Honey'
    ingredient: HONEYCOMB
    products:
    - vape
    - edible
    - joint
    - blunt
    - tobacco
    - chewing_tobacco
    - cigar
    - cigarette
  chocolate:
    name: '&6Chocolate'
    ingredient: COCOA_BEANS
    products:
    - edible
    - cigar
    - tobacco
  vanilla:
    name: '&fVanilla'
    ingredient: SUGAR
    products:
    - vape
    - edible
    - cigar
  cherry:
    name: '&cCherry'
    ingredient: GLOW_BERRIES
    products:
    - vape
    - cart
    - edible
    - tobacco
  citrus:
    name: '&6Citrus'
    ingredient: ORANGE_DYE
    products:
    - vape
    - cart
    - energy_drink
  mint:
    name: '&aMint'
    ingredient: KELP
    products:
    - vape
    - chewing_tobacco
    - joint
  cinnamon:
    name: '&6Cinnamon'
    ingredient: BROWN_DYE
    products:
    - edible
    - tobacco
    - cigar
  coffee:
    name: '&6Coffee'
    ingredient: COCOA_BEANS
    ingredient-crop: coffee
    products:
    - vape
    - edible
    - tobacco
  grape:
    name: '&5Grape'
    ingredient: PURPLE_DYE
    products:
    - vape
    - cart
    - blunt
    - energy_drink
  peach:
    name: '&dPeach'
    ingredient: PINK_DYE
    products:
    - vape
    - cart
    - edible
chat-effects:
  enabled: true
hud:
  enabled: true
recipes:
  bong:
    shape:
    - ' G '
    - BGF
    - ' W '
    ingredients:
      G: GLASS
      B: BLAZE_ROD
      F: FLINT_AND_STEEL
      W: WATER_BUCKET
  farm-controller:
    shape:
    - IRI
    - CBC
    - IRI
    ingredients:
      I: IRON_INGOT
      R: REDSTONE
      C: COPPER_INGOT
      B: BARREL
tolerance:
  default:
    max-tolerance: 5
    decay-delay-minutes: 3
    effectiveness-scaling:
      0: 1.0
      1: 0.9
      2: 0.75
      3: 0.5
      4: 0.3
      5: 0.1
addiction:
  settings:
    enabled: true
    milk_clears_withdrawal: false
    heartbeat_ticks: 20
overdose:
  settings:
    enabled: true
    threshold: 3
    track-per-drug: true
    attempt-expiry: 15
    broadcast-messages: true
  default:
    effects:
    - type: death
      message: '&4%player% died from a drug overdose!'
    - type: message
      text: '&cYou overdosed and died!'
      broadcast: true
  staged:
    enabled: false
    first:
      effects:
      - type: message
        text: '&eYou feel sick from the overdose, but survive.'
      - type: effects
        potion_effects:
        - effect: CONFUSION
          duration: 600
          amplifier: 0
    second:
      effects:
      - type: message
        text: '&cYou barely survive another overdose!'
      - type: damage
        amount: 10
      - type: effects
        potion_effects:
        - effect: WEAKNESS
          duration: 1200
          amplifier: 1
    third:
      effects:
      - type: death
        message: '&4%player% couldn''t handle another overdose and died!'
  random_effects:
    enabled: false
    effects:
    - type: effects
      potion_effects:
      - effect: BLINDNESS
        duration: 600
        amplifier: 1
    - type: damage
      amount: 15
    - type: death
      message: '&4Bad luck! %player% died from an overdose!'
