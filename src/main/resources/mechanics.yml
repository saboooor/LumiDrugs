# Legacy fallback only; cannabis growth now uses growing.yml -> cannabis.growth-seconds.
cannabis:
  # Average time in seconds for a planted weed fern to auto-grow into a large fern.
  growth-seconds: 600

cart:
  # Number of uses before a cart item is consumed.
  durability-uses: 16

bong:
  # Number of hits a bong can be used before it breaks.
  durability-uses: 24

farm:
  # Interval (ticks) between worker AI cycles.
  worker-tick-interval: 30
  # Base mature drug crops harvested per cycle (scaled by villagers up to 5x).
  max-harvest-per-cycle: 1
  # Base seeds planted per cycle (scaled by villagers up to 5x).
  max-plant-per-cycle: 2

vape:
  # Number of puffs before a disposable nicotine vape is consumed.
  durability-uses: 32

# Fictional quality mechanic. 90% is neutral for legacy items and normal production.
# Grade carries through production. Duration and sale value scale by purity / 90.
# Sneak-right-click an empty/water cauldron with one drug in the main hand and
# a vanilla refining ingredient in the offhand; consumes one ingredient per step.
purity:
  enabled: true
  refining-ingredient: QUARTZ
  refining-points: 5             # 1–25 points per refinement, capped at 100%.

# Infusion: sneak-right-click an empty/water cauldron with one unflavored
# product in the main hand and its ingredient in the offhand. Uses one ingredient.
# Effects, strain, and puff counts stay the same. Existing files without this
# section use these defaults. Set flavors: {} to disable flavor infusion.
flavors:
  berry:
    name: "&dBerry"
    ingredient: SWEET_BERRIES
    products: [vape, cart, edible, joint, blunt, energy_drink]
  apple:
    name: "&cApple"
    ingredient: APPLE
    products: [vape, cart, edible, energy_drink]
  melon:
    name: "&aMelon"
    ingredient: MELON_SLICE
    products: [vape, cart, edible, energy_drink]
  honey:
    name: "&6Honey"
    ingredient: HONEYCOMB
    products: [vape, edible, joint, blunt, tobacco, chewing_tobacco, cigar, cigarette]
  chocolate:
    name: "&6Chocolate"
    ingredient: COCOA_BEANS
    products: [edible, cigar, tobacco]
  vanilla:
    name: "&fVanilla"
    ingredient: SUGAR
    products: [vape, edible, cigar]
  cherry:
    name: "&cCherry"
    ingredient: GLOW_BERRIES
    products: [vape, cart, edible, tobacco]
  citrus:
    name: "&6Citrus"
    ingredient: ORANGE_DYE
    products: [vape, cart, energy_drink]
  mint:
    name: "&aMint"
    ingredient: KELP
    products: [vape, chewing_tobacco, joint]
  cinnamon:
    name: "&6Cinnamon"
    ingredient: BROWN_DYE
    products: [edible, tobacco, cigar]
  coffee:
    name: "&6Coffee"
    ingredient: COCOA_BEANS
    # Require custom harvested Coffee Beans, not ordinary cocoa beans.
    ingredient-crop: coffee
    products: [vape, edible, tobacco]
  grape:
    name: "&5Grape"
    ingredient: PURPLE_DYE
    products: [vape, cart, blunt, energy_drink]
  peach:
    name: "&dPeach"
    ingredient: PINK_DYE
    products: [vape, cart, edible]
